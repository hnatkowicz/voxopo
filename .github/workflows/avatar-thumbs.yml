# Makes the small copies of Randy's avatars whenever a drawing is uploaded,
# so he can add SVGs through the GitHub web UI and nothing else is needed.
#
# Why: the full drawings weigh up to ~350 KB each, too much for a phone on
# a pub's cell data to pull for the whole join grid. The grid, scoreboards
# and strips use a few-KB WebP from public/avatars/thumbs/ instead; the full
# SVG only loads where an avatar is shown big. (Until this runs, a new
# drawing still shows: a missing thumb falls back to the SVG.)
#
# - Push to main that touches public/avatars/*.svg: redraw the thumbs of the
#   drawings that changed and commit them back.
# - Nothing here touches the database or the game's code.
name: Avatar thumbnails

on:
  push:
    branches: [main]
    paths: ['public/avatars/*.svg', 'scripts/avatar-thumbs.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avatar-thumbs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get a browser to draw with
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Draw the thumbnails
        run: node scripts/avatar-thumbs.mjs | tee "$RUNNER_TEMP/thumbs.txt"

      - name: Save them
        run: |
          {
            echo '## Avatar thumbnails'
            echo
            echo '```'
            cat "$RUNNER_TEMP/thumbs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git add public/avatars/thumbs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Rebuild avatar thumbnails' -m 'Automatic, by .github/workflows/avatar-thumbs.yml.'
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
