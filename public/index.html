<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/theme.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM! Live Interface</title>
    <link rel="canonical" href="https://randomania.tv/" />
    <link rel="icon" type="image/x-icon" href="/R.ico" />
    <link rel="icon" type="image/svg+xml" href="/r-icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Installable as an app on a laptop (Chrome/Edge: the install button
         in the address bar) -- opens the TV page full screen. TV page only;
         phones are untouched. No offline copy on purpose: we deploy often, and a
         TV running yesterday's page against today's server would break. -->
    <link rel="manifest" href="/tv.webmanifest">
    <meta name="theme-color" content="#0b1424">
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-view="gateway" class="tp-layout">
    <!-- ========================================== -->
    <!--  VIEWPORT 1: THE WELCOME ENTRY GATEWAY     -->
    <!-- ========================================== -->
    <div id="gateway-screen">
        <!-- The TV's start screen in the new layout (Nov 2026): the same top
             bar, footer and right-hand rail as the game screens, so it looks
             like the same product from the first second. -->
        <div class="hud-banner">
            <div style="display: flex; align-items: center; gap: 24px;">
                <a href="/" style="height: 28px; display: flex; align-items: center;">
                    <img src="/randomania-logo.svg" alt="RandoMania!" style="height: 100%; width: auto;" />
                </a>
            </div>
        </div>

        <div class="split-container">
            <div class="left-column gateway-main">
                <div class="gateway-stage">
                    <h1 class="gateway-title">Join a room</h1>
                    <div class="gateway-sub">Type the room code from the host's phone.</div>
                    <div class="gateway-form">
                        <input type="text" id="input-room-code" placeholder="1234" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                        <button id="btn-submit-spectate" class="action-btn-primary">Show</button>
                    </div>
                    <a href="/host" class="gateway-host">Hosting? Open a room at randomania.tv/host</a>
                </div>
                <div class="gateway-foot">
                    <div class="gateway-qr"><img src="qr.png" alt="Scan to play"></div>
                    <div>
                        <div class="gateway-foot-title">Scan to join</div>
                        <div class="gateway-foot-url">randomania.tv/play</div>
                    </div>
                </div>
            </div>

            <!-- Live counts only, never room codes: a code is the only lock on a room. -->
            <div class="right-column">
                <h2 class="board-title">Right now</h2>
                <table class="leaderboard-table">
                    <tbody>
                        <tr class="rail-row"><td class="rail-id">Rooms open</td><td class="rail-score" id="global-active-rooms">--</td></tr>
                        <tr class="rail-row"><td class="rail-id">People playing</td><td class="rail-score" id="global-players-count">--</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- ========================== -->
    <!--  VIEWPORT 2: MATCH ENGINE  -->
    <!-- ========================== -->
    <div id="game-screen">
        <div class="hud-banner">
            <!-- BRANDING + STATUS BLOCK -->
            <div style="display: flex; align-items: center; gap: 24px;">
                <a href="/" style="height: 28px; display: flex; align-items: center;">
                    <!-- Simple, highly portable, and automatically vertically centered by flexbox -->
                    <img src="/randomania-logo.svg" alt="RandoMania!" style="height: 100%; width: auto;" />
                </a>
                
                <div class="status-pill">
                    <div class="status-dot"></div>
                    <div class="status-text" id="room-status-text">Live</div>
                </div>
                <!-- Pub rooms: the venue, during play (the lobby has the big banner). -->
                <div id="venue-hud" class="venue-hud">
                    <img id="venue-hud-logo" src="" alt="">
                    <span id="venue-hud-name"></span>
                </div>
            </div>
            
            <div class="hud-metric">Room <span class="hud-value" style="color: var(--rm-brand);" id="display-room-code-badge">----</span></div>
            <div class="hud-metric" id="hud-players">Players Joined <span class="hud-value" id="lobby-player-count">0</span></div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <button id="btn-fullscreen" class="hud-fullscreen" title="Full screen">⛶<span class="hud-fullscreen-label"> Full screen</span></button>
                <div class="hud-value" id="lobby-countdown">60</div>
            </div>
        </div>
    
        <div class="split-container">
            <!-- LEFT COLUMN: Operations, Animations, and Onboarding HUD Zone -->
            <div class="left-column" id="main-trivia-panel" style="display: flex; flex-direction: column; flex: 65;">
                
                <!-- Pub rooms, lobby only: the venue's logo, name and tagline. -->
                <div id="venue-banner" class="venue-banner">
                    <img id="venue-banner-logo" src="" alt="">
                    <div style="min-width: 0;">
                        <div id="venue-banner-name" class="venue-banner-name"></div>
                        <div id="venue-banner-tagline" class="venue-banner-tagline"></div>
                    </div>
                </div>

                <!-- THE ACTIVE STAGE CONTAINER: Isolated handle for code layout swaps -->
                <div id="active-content-stage" style="display: flex; flex-direction: column; flex: 1;">
                    <!-- Mode tiles are built from public/modes.js (see app.js). -->
                </div>
    
                <!-- MODERN HIGH-UTILITY ONBOARDING PANEL (Stays locked permanently!) -->
                <div id="tv-foot" style="background: var(--rm-surface); border: 1px solid var(--rm-border); border-radius: 12px; padding: 20px 24px; margin-top: 24px; display: flex; align-items: center; gap: 20px; box-sizing: border-box; position: relative; min-height: 114px; flex-shrink: 0;">
                    <div id="room-qr-box" style="background: var(--rm-white); padding: 2px; border-radius: 8px; display: flex; justify-content: center; align-items: center; width: 96px; height: 96px; box-sizing: border-box; flex-shrink: 0; z-index: 10; margin-right: 12px;">
                        <!-- Swapped for this room's own code (play?room=1234) by app.js. -->
                        <img id="room-qr-image" src="qr.png" alt="Scan to Play" style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                    <div id="onboarding-text-slot" style="text-align: left; flex: 1;">
                        <div style="font-size: 1rem; font-weight: 600; color: var(--rm-white); margin-bottom: 4px; letter-spacing: -0.01em;">Scan to join</div>
                        <div style="font-size: 0.85rem; color: var(--rm-text-muted); font-weight: 500;"><span style="color: var(--rm-brand); font-weight: 600;">randomania.tv/play</span></div>
                    </div>
                    <div id="onboarding-status-slot" style="text-align: right; flex: 1; transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1;"></div>
                </div>
    
            </div>
    
            <div class="right-column">
                <h2 class="board-title">Scores</h2>
                <div style="flex: 1; overflow-y: auto;">
                    <table class="leaderboard-table">
                        <tbody id="leaderboard-rows">
                            <tr><td class="indicator-col"></td><td class="rank-col">1</td><td class="awards-col"></td><td class="identity-col"><span class="identity-wrap"><span class="player-emoji">👤</span><span class="player-name" style="color: var(--rm-text-muted);">Awaiting entries...</span></span></td><td class="score-col" style="color: var(--rm-text-muted);">0</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
<audio id="countdown-music" src="/audio/session.wav" preload="auto"></audio>
<audio id="category-music" src="/audio/cat-select.wav" preload="auto"></audio>
<audio id="win-music" src="/audio/confirm-win.wav" preload="auto"></audio>
<audio id="declare-music" src="/audio/impostor-declares.wav" preload="auto"></audio>
<audio id="vote-sound" src="/audio/vote.wav" preload="auto"></audio>
<audio id="impostor-correct-sound" src="/audio/impostor-guess-correct.wav" preload="auto"></audio>
<audio id="final-wager-timer-sound" src="/audio/thirty-second-timer.mp3" preload="auto"></audio>
<audio id="answer-warning-sound" src="/audio/answer-warning.wav" preload="auto"></audio>
<!-- The opening of cat-select.wav, played 30s before a venue break ends. -->
<audio id="break-return-sound" src="/audio/break-return.mp3" preload="auto"></audio>
<audio id="doubler-reveal-sound" src="/audio/DOUBLER_REVEAL.wav" preload="auto"></audio>
<audio id="doubler-correct-sound" src="/audio/DOUBLER_CORRECT.wav" preload="auto"></audio>
<audio id="doubler-wrong-sound" src="/audio/DOUBLER_WRONG.wav" preload="auto"></audio>

<!-- Fixed overlay, outside #active-content-stage on purpose -- a
     RETURN_TO_LOBBY broadcast rewrites that panel almost immediately after
     this fires, and this needs to survive that swap and stay readable for
     its full 10s regardless of whatever screen change happens underneath. -->
<div class="toast-container" id="content-warning-toast">
    <div class="toast-card warning" id="content-warning-card">
        <span class="toast-text" id="content-warning-text"></span>
    </div>
</div>

<!-- Same fixed-overlay reasoning as content-warning-toast above -- survives
     the PICK_TILE panel swap that follows right after a column sweep. -->
<div class="toast-container" id="column-bonus-toast">
    <div class="toast-card celebration" id="column-bonus-card">
        <span class="toast-text" id="column-bonus-text"></span>
    </div>
</div>

<script src="/vendor/qrcode.js" defer></script>
<script src="/modes.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
