<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandoMania Live Interface</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #0d0e11;
            color: #f4f5f6;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            letter-spacing: -0.01em;
        }
        .hud-banner {
            background: #14161d;
            border: 1px solid #222630;
            border-radius: 12px;
            padding: 24px 40px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 230, 118, 0.06);
            border: 1px solid rgba(0, 230, 118, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 12px #00e676;
        }
        .status-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #00e676;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .hud-metric {
            font-size: 0.9rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 500;
        }
        .hud-value {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.4rem;
            margin-left: 6px;
        }
        .split-container {
            display: flex;
            gap: 32px;
            flex: 1;
            min-height: 0;
        }
        .left-column {
            flex: 65;
            display: flex;
            flex-direction: column;
        }
        .right-column {
            flex: 35;
            background: #14161d;
            border: 1px solid #222630;
            border-radius: 12px;
            padding: 32px;
            display: flex;
            flex-direction: column;
        }
        .panel-box {
            background: #14161d;
            border: 1px solid #222630;
            border-radius: 12px;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .panel-title {
            margin: 0 0 32px 0;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .vote-row {
            margin-bottom: 24px;
        }
        .vote-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #e2e5e9;
        }
        .progress-track {
            background: #1e222b;
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #00e676;
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); /* Essential animation anchor */
        }
        .board-title {
            margin: 0 0 24px 0;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard-table th {
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            padding-bottom: 16px;
            border-bottom: 1px solid #222630;
        }
        .leaderboard-table td {
            padding: 16px 0;
            border-bottom: 1px solid #1e222b;
            font-size: 1.05rem;
        }
        .rank-col { width: 12%; color: #64748b; font-weight: 600; }
        .emoji-col { width: 15%; font-size: 1.2rem; text-align: left; }
        .name-col { width: 53%; font-weight: 500; color: #ffffff; }
        .score-col { width: 20%; text-align: right; color: #00e676; font-weight: 600; }
    </style>
</head>
<body>

    <div class="hud-banner">
        <div class="status-pill">
            <div class="status-dot"></div>
            <div class="status-text" id="room-status-text">Connected Live</div>
        </div>
        <div class="hud-metric">Room Code <span class="hud-value" style="color: #00e676;">1234</span></div>
        <div class="hud-metric">Players Joined <span class="hud-value" id="lobby-player-count">0</span></div>
        <div class="hud-value" style="color: #ff4757; font-size: 1.6rem;" id="lobby-countdown">60s</div>
    </div>

    <div class="split-container">
        <div class="left-column">
            <div class="panel-box">
                <h2 class="panel-title">Active Module Election</h2>
                <div style="display: flex; flex-direction: column;">
                    <div class="vote-row">
                        <div class="vote-meta"><span>Trivi-yeah!</span><span id="vcount-TRIVI_YEAH" style="color: #64748b;">0 votes (0%)</span></div>
                        <div class="progress-track"><div id="vbar-TRIVI_YEAH" class="progress-fill"></div></div>
                    </div>
                    <div class="vote-row">
                        <div class="vote-meta"><span>Country Monkey</span><span id="vcount-COUNTRY_MONKEY" style="color: #64748b;">0 votes (0%)</span></div>
                        <div class="progress-track"><div id="vbar-COUNTRY_MONKEY" class="progress-fill" style="background: #ffa500;"></div></div>
                    </div>
                    <div class="vote-row">
                        <div class="vote-meta"><span>EmpossDurr</span><span id="vcount-EMPOSSDURR" style="color: #64748b;">0 votes (0%)</span></div>
                        <div class="progress-track"><div id="vbar-EMPOSSDURR" class="progress-fill" style="background: #ff4757;"></div></div>
                    </div>
                    <div class="vote-row">
                        <div class="vote-meta"><span>Flag Me Down</span><span id="vcount-FLAG_ME_DOWN" style="color: #64748b;">0 votes (0%)</span></div>
                        <div class="progress-track"><div id="vbar-FLAG_ME_DOWN" class="progress-fill" style="background: #2d9cdb;"></div></div>
                    </div>
                    <div class="vote-row">
                        <div class="vote-meta"><span>On The Spectrum</span><span id="vcount-ON_THE_SPECTRUM" style="color: #64748b;">0 votes (0%)</span></div>
                        <div class="progress-track"><div id="vbar-ON_THE_SPECTRUM" class="progress-fill" style="background: #bb6bd9;"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-column">
            <h2 class="board-title">Active Standings</h2>
            <div style="flex: 1; overflow-y: auto;">
                <table class="leaderboard-table">
                    <thead><tr><th>Pos</th><th>ID</th><th>Player</th><th style="text-align: right;">Score</th></tr></thead>
                    <tbody id="leaderboard-rows">
                        <tr><td class="rank-col">1</td><td class="emoji-col">👤</td><td class="name-col" style="color: #64748b;">Awaiting entries...</td><td class="score-col" style="color: #64748b;">0</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const socket = new WebSocket(`wss://${window.location.host}`);
        
        socket.onopen = () => {
            socket.send(JSON.stringify({ type: 'REGISTER_SCREEN', roomCode: '1234' }));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log("[WebSocket API Event Received]", data);

            if (data.type === 'LEADERBOARD_UPDATE') {
                updateLeaderboardUI(data.players);
            }
            if (data.type === 'VOTE_UPDATE') {
                updateModuleElectionUI(data.votes, data.totalVotes);
            }
        };

        function updateLeaderboardUI(playersList) {
            document.getElementById('lobby-player-count').innerText = playersList.length;
            const tbody = document.getElementById('leaderboard-rows');
            tbody.innerHTML = '';

            playersList.sort((a, b) => b.score - a.score);

            playersList.forEach((player, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank-col">${index + 1}</td>
                    <td class="emoji-col">${player.emoji || '👤'}</td>
                    <td class="name-col">${player.name}</td>
                    <td class="score-col">${player.score || 0}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateModuleElectionUI(votes, totalVotes) {
            if (!totalVotes || totalVotes === 0) return;

            const keys = ['TRIVI_YEAH', 'COUNTRY_MONKEY', 'EMPOSSDURR', 'FLAG_ME_DOWN', 'ON_THE_SPECTRUM'];

            keys.forEach(key => {
                const count = votes[key] || 0;
                const percentage = Math.round((count / totalVotes) * 100);
                
                                // Align IDs perfectly to completely resolve the rendering block
                document.getElementById(`vbar-${key}`).style.width = `${percentage}%`;
                document.getElementById(`vcount-${key}`).innerText = `${count} votes (${percentage}%)`;
            });
        }
    </script>
</body>
</html>
