<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandoMania | Controller</title>
    <style>
        /* Minimalist Modern Dark Theme Settings */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; 
            background: #0d0e11; 
            color: #f4f5f6; 
            text-align: center; 
            padding: 30px 20px; 
            margin: 0; 
            letter-spacing: -0.01em;
        }
        .card { 
            background: #14161d; 
            border: 1px solid #222630; 
            border-radius: 12px; 
            padding: 32px 24px; 
            max-width: 400px; 
            margin: 20px auto; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
        }
        h1 { color: #ffffff; font-size: 1.5rem; font-weight: 600; margin: 0 0 6px 0; letter-spacing: -0.02em; }
        p.subtitle { color: #64748b; margin: 0 0 32px 0; font-size: 0.9rem; font-weight: 500; }
        
        .input-group { margin-bottom: 24px; text-align: left; }
        label { display: block; margin-bottom: 10px; font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 0.08em; }
        input[type="text"] { width: 100%; padding: 14px; background: #1e222b; border: 1px solid #222630; border-radius: 8px; color: #fff; font-size: 1.05rem; box-sizing: border-box; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #00e676; outline: none; }
        
        /* 24-Avatar Grid Alignment Layout */
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
        .emoji-btn { background: #1e222b; border: 1px solid #222630; font-size: 1.3rem; padding: 12px 0; border-radius: 8px; cursor: pointer; transition: all 0.1s ease; }
        .emoji-btn.selected { background: rgba(0, 230, 118, 0.06); border-color: #00e676; transform: scale(1.05); }

        /* Minimal Text-Only Module Rows Layout */
        .module-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
        .module-row {
            background: #1e222b;
            border: 1px solid #222630;
            border-radius: 8px;
            padding: 16px 20px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #e2e5e9;
            transition: all 0.15s ease;
        }
        .module-row.selected { 
            border-color: #00e676; 
            background: rgba(0, 230, 118, 0.04); 
            color: #00e676; 
            font-weight: 600;
        }

        .btn { background: #00e676; color: #0d0e11; border: none; padding: 16px; border-radius: 8px; font-size: 1.05rem; font-weight: 600; width: 100%; cursor: pointer; margin-top: 24px; letter-spacing: 0.02em; }
        .btn:hover { background: #00c862; }
        .feedback { margin-top: 20px; font-weight: 500; padding: 12px; border-radius: 8px; display: none; font-size: 0.9rem; border: 1px solid transparent; }
        
        #game-screen { display: none; }
        .player-badge { background: #1e222b; padding: 14px; border-radius: 8px; border: 1px solid #222630; margin-bottom: 24px; font-size: 0.95rem; color: #00e676; font-weight: 600; text-align: left; }
    </style>
</head>
<body>

    <!-- SCREEN 1: MODERN STREAMLINED LOBBY PORTAL -->
    <div id="login-screen" class="card">
        <h1>RandoMania Lobby</h1>
        <p class="subtitle">Securely join the live room session</p>
        
        <div class="input-group">
            <label>4-Digit Room Code</label>
            <input type="text" id="room-code" placeholder="e.g., 1234">
        </div>
        <div class="input-group">
            <label>Your Nickname</label>
            <input type="text" id="player-name" placeholder="e.g., Randy">
        </div>

                <!-- THE 24 UNIVERSALLY SUPPORTED LEGACY-SAFE AVATARS -->
        <div class="input-group">
            <label>Select Identity Avatar</label>
            <div class="emoji-grid">
                <!-- Row 1 -->
                <button class="emoji-btn" onclick="selectAvatar(this, '👑')">👑</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🚀')">🚀</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '⭐')">⭐</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '💎')">💎</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🎈')">🎈</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🔥')">🔥</button>
                <!-- Row 2 -->
                <button class="emoji-btn" onclick="selectAvatar(this, '🦊')">🦊</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🦁')">🦁</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🐸')">🐸</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🦉')">🦉</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🐯')">🐯</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🐬')">🐬</button>
                <!-- Row 3 -->
                <button class="emoji-btn" onclick="selectAvatar(this, '🎯')">🎯</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🎲')">🎲</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🎱')">🎱</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🏆')">🏆</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '⚽')">⚽</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🎨')">🎨</button>
                <!-- Row 4 -->
                <button class="emoji-btn" onclick="selectAvatar(this, '⛵')">⛵</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '⚓')">⚓</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🔑')">🔑</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🔔')">🔔</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🍀')">🍀</button>
                <button class="emoji-btn" onclick="selectAvatar(this, '🍄')">🍄</button>
            </div>
        </div>


        <!-- MINIMAL TEXT-ONLY SELECTION ROWS LIST -->
        <div class="input-group">
            <label>Select Module Preference</label>
            <div class="module-list">
                <div class="module-row" onclick="selectModule(this, 'TRIVI_YEAH')">Trivi-yeah!</div>
                <div class="module-row" onclick="selectModule(this, 'COUNTRY_MONKEY')">Country Monkey</div>
                <div class="module-row" onclick="selectModule(this, 'EMPOSSDURR')">EmpossDurr</div>
                <div class="module-row" onclick="selectModule(this, 'FLAG_ME_DOWN')">Flag Me Down</div>
                <div class="module-row" onclick="selectModule(this, 'ON_THE_SPECTRUM')">On The Spectrum</div>
            </div>
        </div>

        <button class="btn" onclick="executeRoomOnboarding()">Submit Entry</button>
        <div id="login-feedback" class="feedback"></div>
    </div>

    <!-- SCREEN 2: MINIMAL INTERFACE CONTROLLER GAMEPAD -->
    <div id="game-screen" class="card">
        <h1>RandoMania Controller</h1>
        <p class="subtitle" style="margin-bottom: 20px;">Connection active with TV stream dashboard</p>
        
        <div class="player-badge">
            🟢 Active: <span id="badge-emoji">-</span> <span id="badge-name" style="font-weight:bold; color:#fff;">-</span> 
            <span style="float: right; color: #64748b; font-weight: 500;">Room: <span id="badge-room" style="color:#fff; font-weight:bold;">-</span></span>
        </div>

        <div class="input-group">
            <label>Submit Response or Command</label>
            <input type="text" id="game-input" placeholder="Type answer here...">
        </div>

        <button class="btn" onclick="submitGameAction()">Submit Action</button>
        <div id="game-feedback" class="feedback"></div>
    </div>

    <script>
        let chosenAvatar = '👤';
        let chosenModule = '';

        function selectAvatar(element, avatarChar) {
            const btns = document.getElementsByClassName("emoji-btn");
            for (let i = 0; i < btns.length; i++) { btns[i].classList.remove("selected"); }
            element.classList.add("selected");
            chosenAvatar = avatarChar;
        }

        function selectModule(element, moduleKey) {
            const rows = document.getElementsByClassName("module-row");
            for (let i = 0; i < rows.length; i++) { rows[i].classList.remove("selected"); }
            element.classList.add("selected");
            chosenModule = moduleKey;
        }

        async function executeRoomOnboarding() {
            const room = document.getElementById('room-code').value.trim();
            const name = document.getElementById('player-name').value.trim();
            const feedback = document.getElementById('login-feedback');

            if (!room || !name) {
                showFeedback(feedback, "⚠️ Name and Room fields are required.", "rgba(255,165,0,0.15)", "#ffa500", "rgba(255,165,0,0.1)");
                return;
            }
            if (!chosenModule) {
                showFeedback(feedback, "⚠️ Select a module preference to submit your vote.", "rgba(255,165,0,0.15)", "#ffa500", "rgba(255,165,0,0.1)");
                return;
            }

            // Since phone field is gone, we use the Player Name cleanly as their unique Tracking Key token!
            localStorage.setItem('randomania_nickname', name);

            showFeedback(feedback, "Connecting to live room pool...", "rgba(255,165,0,0.06)", "#ffa500", "rgba(255,165,0,0.1)");

            try {
                // Compile the payload string exactly matching your engine parameters
                // Layout: "ROOM NAME AVATAR MODULE"
                                const completeBodyText = `${room} ${name} ${chosenAvatar} ${chosenModule}`;

                const response = await fetch('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ From: name, Body: completeBodyText }) // Passes Name as the unique From key!
                });
                const data = await response.json();

                document.getElementById('badge-name').innerText = name;
                document.getElementById('badge-room').innerText = room;
                document.getElementById('badge-emoji').innerText = chosenAvatar;
                
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('game-screen').style.display = "block";

            } catch (error) {
                showFeedback(feedback, "❌ Live connection timed out. Check server logs.", "rgba(255,71,87,0.06)", "#ff4757", "rgba(255,71,87,0.1)");
            }
        }

        async function submitGameAction() {
            const actionText = document.getElementById('game-input').value.trim();
            const feedback = document.getElementById('game-feedback');
            if (!actionText) return;

            showFeedback(feedback, "Transmitting data frame...", "rgba(255,165,0,0.06)", "#ffa500", "rgba(255,165,0,0.1)");

            try {
                const registeredName = localStorage.getItem('randomania_nickname') || 'test-handset';
                const response = await fetch('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ From: registeredName, Body: actionText })
                });
                const data = await response.json();
                showFeedback(feedback, `📡 Server: ${data.reply}`, "rgba(0,230,118,0.06)", "#00e676", "rgba(0,230,118,0.1)");
                document.getElementById('game-input').value = ""; 
            } catch (error) {
                showFeedback(feedback, "❌ Action transmission failed.", "rgba(255,71,87,0.06)", "#ff4757", "rgba(255,71,87,0.1)");
            }
        }

        function showFeedback(element, text, bg, color, border) {
            element.style.display = "block";
            element.style.background = bg;
            element.style.color = color;
            element.style.borderColor = border;
            element.innerText = text;
        }
    </script>
</body>
</html>
